{% extends "base.html" %}

{% block content %}
<h1>Cadastro de usuário</h1>

{% with mensagens = get_flashed_messages() %}
  {% if mensagens %}
    {% for m in mensagens %}
      <p class="mensagem">{{ m }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('cadastro') }}">
  <label for="nome">Nome</label>
  <input type="text" id="nome" name="nome" maxlength="100" required style="color: black;">

  <label for="email">E-mail</label>
  <input type="email" id="email" name="email" maxlength="100" required style="color: black;">

  <label for="senha">Senha</label>
  <input type="password" id="senha" name="senha" minlength="6" required style="color: black;">

  <button type="submit">Cadastrar</button>
</form>
{% endblock %}
